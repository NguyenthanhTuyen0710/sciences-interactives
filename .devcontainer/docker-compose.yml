services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgresql://edu:edu@db:5432/eduplateforme
      AUTH_SECRET: demo-secret-codespaces-0123456789abcdef
      TEACHER_INVITE_CODE: PROF-2026
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: eduplateforme
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
