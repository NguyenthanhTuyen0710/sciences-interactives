# Production d'un chapitre par le pipeline existant (pipeline/run.ts) via l'API Claude.
#   dry-run : contrôle des données + estimation des coûts, aucun appel API, aucune clé exposée.
#   submit    : soumet la prochaine étape par Message Batches. Refusé tant que l'une des conditions manque : registre
#               des dépenses synchronisé (release brouillon « data-store »), creditVerified, plafond 10 USD, aucune
#               requête identique déjà soumise, aucune opération à l'issue inconnue (pipeline/ledger.ts).
#   collect   : récupère le résultat d'un batch_id et solde son coût ; aucune nouvelle requête payante.
#   reconcile : rattache une réservation à l'issue inconnue au batch réellement créé (lecture seule côté API).
# Les fichiers produits sont publiés comme artefact du run, jamais committés : relecture humaine obligatoire.
# Droits : seuls les jobs ledger-pull et ledger-push (stockage « data-store ») ont contents: write ; le job qui
# détient la clé API n'a que contents: read et reçoit le registre par artefact, vérifié par SHA256.
#
# Déclenchement automatique : après un run réussi de « Collect Sources » (workflow_run) → TOUJOURS dry-run sur le
# prochain chapitre de la matrice de couverture (--next), sans clé API. pilot / production : lancement manuel seulement.
name: Generate Lessons

on:
  workflow_run:
    workflows: ["Collect Sources"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (sans API) | pilot (Message Batches, plafond d'essai) | production (fermé pendant l'essai) | collect (résultat d'un batch) | reconcile | publish (sans API : inscrit le chapitre « chapitre » déjà présent et ouvre une PR)"
        type: choice
        options: [dry-run, pilot, production, collect, reconcile, publish]
        default: dry-run
      niveau:
        description: "Niveau (doit correspondre à la fiche du chapitre)"
        type: choice
        options: [3e, 4e, 5e, 6e, 2nde, 1re, Tle]
        default: 3e
      matiere:
        description: "Matière (doit correspondre à la fiche du chapitre)"
        type: choice
        options: [mathematiques, physique-chimie]
        default: mathematiques
      parcours:
        description: "Parcours : « college » au collège ; lycée : tronc-commun | specialite | maths-complementaires | maths-expertes"
        type: string
        default: college
      chapitre:
        description: "Identifiant de chapitre (pipeline/chapters/<id>.json) ; vide = prochain chapitre de la matrice de couverture"
        type: string
        default: ""
      exercise_count:
        description: "Nombre d'exercices imposé (1-60) ; vide = règle normale (≥ 30)"
        type: string
        default: ""
      batch_id:
        description: "Identifiant msgbatch_… (mode collect uniquement)"
        type: string
        default: ""
      dossier_model:
        description: "Modèle imposé pour le dossier (comparaison du pilote) ; « defaut » = palier normal, empreinte inchangée"
        type: choice
        options: [defaut, haiku, sonnet]
        default: defaut
      force:
        description: "Refaire une étape déjà faite ou un fichier existant (--force) ; à n'utiliser que sur décision"
        type: boolean
        default: false
      retry_reason:
        description: "Nouvel envoi motivé (M17) d'une étape payée sans résultat utilisable : motif obligatoire ; une seule fois"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: data-store # une seule exécution à la fois sur le registre partagé (avec collect-sources.yml) : pas de run en double
  cancel-in-progress: false

jobs:
  # Paramètres normalisés pour les deux déclencheurs ; workflow_run ne peut produire qu'un dry-run.
  setup:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      api: ${{ steps.p.outputs.api }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          mode="$MODE_IN"
          if [ "$EVENT" = "workflow_run" ]; then mode="dry-run"; fi
          if [ "$mode" = "production" ]; then echo "::error::mode production fermé pendant la phase d'essai (décision du porteur de projet requise)"; exit 1; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "dry-run" ] || [ "$mode" = "publish" ]; then echo "api=false" >> "$GITHUB_OUTPUT"; else echo "api=true" >> "$GITHUB_OUTPUT"; fi
          echo "Déclencheur : $EVENT ; mode retenu : $mode"

  # Lecture du registre des dépenses pour TOUS les modes, dry-run compris : la dépense comptée et le plafond restant
  # affichés (et le contrôle de budget) reposent sur le registre réel. Ce job ne fait que lire (pull-ledger) ;
  # seul ledger-push écrit, et uniquement pour les modes qui appellent l'API.
  ledger-pull:
    needs: setup
    if: needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # lecture d'une release brouillon (réservée aux jetons en écriture) ; aucune écriture dans ce job
    steps:
      - uses: actions/checkout@v5
      - name: Lire le registre des dépenses (SHA256 vérifié)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/data-store.sh pull-ledger
      - uses: actions/upload-artifact@v6
        with:
          name: ledger-in
          path: pipeline/.store/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  pipeline:
    needs: [setup, ledger-pull]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.mode != 'publish' && needs.ledger-pull.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      started: ${{ steps.mark.outputs.started || steps.premark.outputs.started }}
      chapter: ${{ steps.run.outputs.chapter }}
      usable: ${{ steps.run.outputs.usable }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Aucun appel possible avant cette étape
        run: echo "started=false" >> "$GITHUB_OUTPUT"
        id: premark

      - name: Recevoir le registre (lecture seule en dry-run)
        uses: actions/download-artifact@v7
        with:
          name: ledger-in
          path: pipeline/.store

      - name: Vérifier le registre reçu
        run: |
          (cd pipeline/.store && sha256sum -c ledger.sha256)
          npx tsx pipeline/ledger.ts check pipeline/.store/ledger.jsonl
          echo "PIPELINE_LEDGER_SYNCED=1" >> "$GITHUB_ENV"

      - name: Marquer le début des appels possibles
        id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Pipeline (${{ needs.setup.outputs.mode }})
        id: run
        shell: bash
        env:
          MODE: ${{ needs.setup.outputs.mode }}
          LEVEL: ${{ inputs.niveau || '3e' }}
          SUBJECT: ${{ inputs.matiere || 'mathematiques' }}
          PARCOURS: ${{ inputs.parcours || 'college' }}
          CHAPTER: ${{ inputs.chapitre }}
          EXERCISES: ${{ inputs.exercise_count }}
          BATCH_ID: ${{ inputs.batch_id }}
          DOSSIER_MODEL: ${{ inputs.dossier_model || 'defaut' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          RETRY_REASON: ${{ inputs.retry_reason }}
          # La clé n'est transmise qu'aux modes qui appellent l'API ; GitHub la masque dans les journaux
          # et pipeline/run.ts ne l'affiche jamais. workflow_run → dry-run → aucune clé.
          ANTHROPIC_API_KEY: ${{ needs.setup.outputs.api == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          if [ -n "$CHAPTER" ]; then args=("$CHAPTER"); else args=(--next); fi
          args+=(--level "$LEVEL" --subject "$SUBJECT" --parcours "$PARCOURS")
          if [ -n "$EXERCISES" ]; then args+=(--exercises "$EXERCISES"); fi
          if [ "$DOSSIER_MODEL" != "defaut" ]; then args+=(--dossier-model "$DOSSIER_MODEL"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$RETRY_REASON" ]; then args+=(--retry "$RETRY_REASON"); fi
          case "$MODE" in
            dry-run) args+=(--batch) ;;
            pilot)   args+=(--submit) ;;
            collect)
              if [ -z "$BATCH_ID" ]; then echo "::error::batch_id est obligatoire en mode collect"; exit 2; fi
              if [ -z "$CHAPTER" ]; then echo "::error::chapitre est obligatoire en mode collect"; exit 2; fi
              args+=(--collect "$BATCH_ID") ;;
            reconcile)
              if [ -z "$CHAPTER" ]; then echo "::error::chapitre est obligatoire en mode reconcile"; exit 2; fi
              args+=(--reconcile) ;;
            *) echo "::error::mode inconnu : $MODE"; exit 2 ;;
          esac
          mkdir -p pipeline-output
          set +e
          npx tsx pipeline/run.ts "${args[@]}" 2>&1 | tee pipeline-output/run.log
          code=${PIPESTATUS[0]}
          set -e
          chapter=$(node -e 'try{process.stdout.write(require("./pipeline-output/summary.json").chapter||"")}catch{}')
          echo "chapter=${chapter:-aucun}" >> "$GITHUB_OUTPUT"
          # « true » seulement si ce run a écrit au moins une sortie utilisable (collect terminé, résultat non tronqué).
          usable=$(node -e 'try{process.stdout.write((require("./pipeline-output/summary.json").usableOutputs||[]).length?"true":"false")}catch{process.stdout.write("false")}')
          echo "usable=${usable}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Cohérence du registre après exécution
        if: always() && needs.setup.outputs.api == 'true'
        run: npx tsx pipeline/ledger.ts check pipeline/.store/ledger.jsonl --base pipeline/.store/ledger.base.jsonl

      - name: Transmettre le registre
        if: always() && needs.setup.outputs.api == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ledger-out
          path: pipeline/.store/ledger.jsonl
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Résumé
        if: always()
        shell: bash
        run: |
          {
            cat pipeline-output/summary.md 2>/dev/null || echo "### Pipeline — aucun rapport (arrêt avant le choix du chapitre)"
            echo ""
            echo "<details><summary>Journal complet</summary>"
            echo ""
            echo '```'
            cat pipeline-output/run.log 2>/dev/null || echo "(pas de journal)"
            echo '```'
            echo "</details>"
            echo ""
            echo "Sorties dans l'artefact du run : brouillons non publiés ; publication uniquement par PR relue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les sorties (artefact, sans commit)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lessons-${{ steps.run.outputs.chapter || 'aucun' }}-${{ needs.setup.outputs.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            pipeline-output/
            pipeline/state/
            research/dossiers/${{ steps.run.outputs.chapter || 'aucun' }}.md
            src/lib/chapters/data/${{ steps.run.outputs.chapter || 'aucun' }}.ts
            project/reports/*-QA-api.md

  # Publication par Pull Request (jamais de commit direct sur la branche par défaut) : après un collect réussi, les
  # fichiers produits (chapitre TS, dossier, relecture) sont copiés, contrôlés (ChapterSchema, validate-chapter, tsc),
  # le chapitre est inscrit au registre (brouillon invisible tant qu'il n'est pas « published »), la matrice de
  # couverture et project/ledger.json sont régénérés, puis une PR est ouverte pour relecture humaine.
  # Prérequis côté dépôt : Settings → Actions → « Allow GitHub Actions to create and approve pull requests ».
  publish-pr:
    needs: [setup, pipeline]
    # collect : uniquement si le run a produit une sortie utilisable (pas de PR vide quand le batch n'est pas terminé, cf. PR #10, #12).
    if: always() && needs.setup.result == 'success' && ((needs.setup.outputs.mode == 'collect' && needs.pipeline.result == 'success' && needs.pipeline.outputs.chapter != 'aucun' && needs.pipeline.outputs.usable == 'true') || (needs.setup.outputs.mode == 'publish' && inputs.chapitre != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Base = branche par défaut : la PR ne contient que la publication, quelle que soit la branche du run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Récupérer les sorties du run
        if: needs.setup.outputs.mode == 'collect'
        uses: actions/download-artifact@v7
        with:
          name: lessons-${{ needs.pipeline.outputs.chapter }}-collect-${{ github.run_id }}
          path: ${{ runner.temp }}/out

      - name: Copier et inscrire
        id: apply
        env:
          CHAPTER: ${{ needs.pipeline.outputs.chapter || inputs.chapitre }}
          OUT: ${{ runner.temp }}/out
        run: |
          copied=0
          for f in "src/lib/chapters/data/$CHAPTER.ts" "research/dossiers/$CHAPTER.md"; do
            if [ -f "$OUT/$f" ]; then mkdir -p "$(dirname "$f")"; cp "$OUT/$f" "$f"; copied=$((copied+1)); fi
          done
          for f in "$OUT"/project/reports/*-QA-api.md; do [ -f "$f" ] && cp "$f" project/reports/ && copied=$((copied+1)); done
          if [ -f "src/lib/chapters/data/$CHAPTER.ts" ]; then npm run dashboard -- register "$CHAPTER"; else npm run dashboard; fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "Fichiers copiés depuis l'artefact : $copied"

      # Les PR ouvertes avec GITHUB_TOKEN ne déclenchent pas « PR Checks » : les mêmes contrôles sont exécutés ici, sur
      # l'état exact de la PR. Un seul contrôle rouge → aucune PR. Le tableau est repris dans la description de la PR.
      - name: Contrôles de la PR (ChapterSchema, validate-chapter, tsc, tests, lint, build)
        if: steps.apply.outputs.changed == 'true'
        env:
          CHAPTER: ${{ needs.pipeline.outputs.chapter || inputs.chapitre }}
        run: |
          table="$RUNNER_TEMP/checks.md"; failed=0
          printf '| Contrôle | Résultat | Durée |\n|---|---|---|\n' > "$table"
          row() { echo "| $1 | $2 | $3 s |" >> "$table"; }
          check() { local name="$1"; shift; local t0=$SECONDS
            if "$@" > "$RUNNER_TEMP/check.log" 2>&1; then row "$name" "✔" $((SECONDS - t0))
            else row "$name" "✘ (voir le journal du job)" $((SECONDS - t0)); failed=1; echo "::group::$name (échec)"; tail -n 80 "$RUNNER_TEMP/check.log"; echo "::endgroup::"; fi; }
          file="src/lib/chapters/data/$CHAPTER.ts"
          if [ -f "$file" ]; then
            t0=$SECONDS
            npx tsx scripts/validate-chapter.ts "$file" --json > "$RUNNER_TEMP/validate.json" 2> "$RUNNER_TEMP/validate.err" || true
            res=$(node -e '
              const fs = require("fs"); let r;
              try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8").trim().split("\n").pop()); } catch { console.log("✘ chargement impossible|✘ chargement impossible"); process.exit(); }
              const schema = r.issues.filter((i) => i.where.startsWith("schema:")).length;
              console.log(`${schema ? "✘ " + schema + " écart(s)" : "✔"}|${r.summary.ok ? "✔ " + r.summary.instances + " tirages" : "✘ " + r.summary.issues + " problème(s)"}`);
            ' "$RUNNER_TEMP/validate.json")
            row "ChapterSchema" "${res%%|*}" $((SECONDS - t0)); row "validate-chapter" "${res##*|}" $((SECONDS - t0))
            case "$res" in *✘*) failed=1; cat "$RUNNER_TEMP/validate.err" | tail -n 40 ;; esac
          else
            row "ChapterSchema" "sans objet (aucun fichier de chapitre)" 0; row "validate-chapter" "sans objet" 0
          fi
          check "tsc" npx tsc --noEmit
          check "tests (vitest)" npm test
          check "lint (ESLint)" npm run lint
          check "build (Next.js)" npm run build
          cat "$table" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" = 1 ]; then echo "::error::au moins un contrôle est rouge : aucune PR n'est ouverte"; exit 1; fi

      - name: Ouvrir la Pull Request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAPTER: ${{ needs.pipeline.outputs.chapter || inputs.chapitre }}
          OUT: ${{ runner.temp }}/out
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="pipeline/$CHAPTER-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A src/lib/chapters research/dossiers project/reports project/ledger.json project/dashboard.md research/curriculum/coverage-matrix.json research/curriculum/coverage-matrix.md research/curriculum/master-curriculum.json
          git commit -m "Pipeline : $CHAPTER (run ${{ github.run_id }}) — à relire avant publication"
          git push -u origin "$branch"
          {
            echo "Sorties du pipeline pour \`$CHAPTER\` (run ${{ github.run_id }}). **Relecture humaine obligatoire** ; le chapitre reste \`draft\` (invisible) tant que \`publicationStatus\` n'est pas \`published\`."
            echo ""
            cat "$OUT/pipeline-output/summary.md" 2>/dev/null || true
            echo ""
            echo "### Contrôles exécutés dans le job (état exact de cette PR)"
            echo ""
            echo "Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (les PR ouvertes par github-actions[bot] ne déclenchent pas « PR Checks »)."
            echo ""
            cat "$RUNNER_TEMP/checks.md"
            echo ""
            echo "Matrice de couverture et project/ledger.json régénérés ; registre des dépenses : data-store (hors Git)."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE" --head "$branch" --title "Pipeline : $CHAPTER (run ${{ github.run_id }})" --body-file "$RUNNER_TEMP/pr-body.md"

  ledger-push:
    needs: [setup, ledger-pull, pipeline]
    if: always() && needs.setup.outputs.api == 'true' && needs.ledger-pull.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v7
        with:
          name: ledger-in
          path: pipeline/.store

      - name: Recevoir le registre modifié
        id: out
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ledger-out
          path: ledger-out

      - name: Registre perdu → opération inconnue (bloque tout envoi jusqu'à réconciliation)
        # sorties absentes (job interrompu brutalement) = on ne sait pas : marquage prudent
        if: steps.out.outcome != 'success' && needs.pipeline.outputs.started != 'false'
        run: |
          echo "::warning::registre de l'exécution non transmis : ajout d'une opération à l'issue inconnue"
          node -e 'console.log(JSON.stringify({type:"unknown",id:"run-"+process.env.GITHUB_RUN_ID,at:new Date().toISOString(),error:"exécution interrompue sans registre"}))' >> pipeline/.store/ledger.jsonl

      - name: Utiliser le registre modifié
        if: steps.out.outcome == 'success'
        run: cp ledger-out/ledger.jsonl pipeline/.store/ledger.jsonl

      - name: Publier le registre (cohérence, ajout seul, SHA256, sauvegarde)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/data-store.sh push-ledger
