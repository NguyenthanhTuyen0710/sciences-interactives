# Collecteur de sources officielles (pipeline/sources/run.ts) — lancement manuel uniquement.
#   check  (défaut) : contrôles registre / G0 / G1 / préfixes / robots.txt ; aucun document téléchargé.
#   fetch  : télécharge uniquement les seeds approuvés (G0 + G1), ≤ 20, délai ≥ 10 s par hôte.
#   verify : recalcule la vérification à partir des documents stockés (sans réseau vers les sources).
# Droits : seuls docs-pull et docs-push (release brouillon « data-store ») ont contents: write. Seuls les documents
# dont la conservation est approuvée (registry.json → g0.storage) y sont copiés. Les enregistrements
# research/sources/records/*.json sont publiés en artefact, à relire puis committer à la main : aucun commit automatique.
name: Collect Sources

on:
  workflow_dispatch:
    inputs:
      command:
        description: "check (sans téléchargement) | fetch (seeds approuvés) | verify"
        type: choice
        options: [check, fetch, verify]
        default: check
      only:
        description: "Limiter à un seed (identifiant de research/sources/seeds.json) ; vide = tous"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: data-store
  cancel-in-progress: false

jobs:
  docs-pull:
    if: inputs.command != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # lecture d'une release brouillon
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les documents (SHA256 vérifié)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/data-store.sh pull-docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-in
          path: .sources-cache/docs/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  collect:
    needs: docs-pull
    if: always() && (inputs.command == 'check' || needs.docs-pull.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Cache local des sources (accélération uniquement)
        uses: actions/cache@v4
        with:
          path: .sources-cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Recevoir les documents stockés
        if: inputs.command != 'check'
        continue-on-error: true # aucun document stocké pour l'instant
        uses: actions/download-artifact@v4
        with:
          name: docs-in
          path: .sources-cache/docs

      - name: Collecteur (${{ inputs.command }})
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          ONLY: ${{ inputs.only }}
        run: |
          args=("$COMMAND")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          mkdir -p sources-output
          npx tsx pipeline/sources/run.ts "${args[@]}" 2>&1 | tee sources-output/run.log

      - name: Transmettre les documents téléchargés
        if: inputs.command == 'fetch'
        uses: actions/upload-artifact@v4
        with:
          name: docs-out
          path: .sources-cache/docs/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

      - name: Résumé
        if: always()
        shell: bash
        run: |
          {
            echo "### Collecteur — \`${{ inputs.command }}\`"
            echo '```'
            cat sources-output/run.log 2>/dev/null || echo "(pas de journal)"
            echo '```'
            echo "Enregistrements dans l'artefact : à relire avant tout commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les enregistrements (artefact, sans commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ inputs.command }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            sources-output/
            research/sources/records/

  docs-push:
    needs: collect
    if: inputs.command == 'fetch' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Recevoir les enregistrements et documents
        uses: actions/download-artifact@v4
        with:
          name: records-${{ inputs.command }}-${{ github.run_id }}
          path: from-collect

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: docs-out
          path: .sources-cache/docs

      - name: Sauvegarder les documents dont la conservation est approuvée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/sources/records
          cp from-collect/research/sources/records/*.json research/sources/records/ 2>/dev/null || true
          bash .github/scripts/data-store.sh push-docs
