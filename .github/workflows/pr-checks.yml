# Contrôles d'une pull request vers main : types, lint, tests, build et dry-run du pipeline.
# Aucun secret n'est référencé ici : le dry-run n'a ni clé ni client API (pipeline/run.ts sans --live/--submit/--collect).
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Types (tsc)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build

      - name: Dry-run du pipeline (Pythagore 3e, 5 exercices, sans clé ni appel API)
        shell: bash
        run: |
          npx tsx pipeline/run.ts math-3e-pythagore --level 3e --subject mathematiques --exercises 5 --batch 2>&1 | tee dry-run.log
          grep -q "mode dry-run" dry-run.log
          if grep -qE "soumis|coût réel" dry-run.log; then echo "::error::le dry-run a tenté un appel API"; exit 1; fi
          { echo '### Dry-run pipeline'; echo '```'; cat dry-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
