# Contrôles d'une pull request vers main : types, lint, tests, build et dry-run du pipeline.
# Aucun secret n'est référencé ici : le dry-run n'a ni clé ni client API (pipeline/run.ts sans --live/--submit/--collect).
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Types (tsc)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build

      # Chapitre témoin : math-3e-calcul-litteral (fiche sans chapitre produit). Pythagore n'est plus le témoin depuis
      # la QA tier 2 (décision du porteur de projet du 2026-11-18) : il reste « needs-human » jusqu'à la correction (A).
      - name: Dry-run du pipeline (calcul littéral 3e, 5 exercices, sans clé ni appel API)
        shell: bash
        run: |
          npx tsx pipeline/run.ts math-3e-calcul-litteral --level 3e --subject mathematiques --exercises 5 --batch 2>&1 | tee dry-run.log
          grep -q "mode dry-run" dry-run.log
          if grep -qE "soumis|coût réel" dry-run.log; then echo "::error::le dry-run a tenté un appel API"; exit 1; fi
          { echo '### Dry-run pipeline'; echo '```'; cat dry-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run du pipeline (physique-chimie 4e, électricité, sans clé ni appel API)
        shell: bash
        run: |
          npx tsx pipeline/run.ts pc-4e-electricite --level 4e --subject physique-chimie --exercises 5 --batch 2>&1 | tee dry-run-pc.log
          grep -q "mode dry-run" dry-run-pc.log
          grep -q "contrôle des données : OK (4e, physique-chimie" dry-run-pc.log
          if grep -qE "soumis|coût réel" dry-run-pc.log; then echo "::error::le dry-run a tenté un appel API"; exit 1; fi
          { echo '### Dry-run pipeline (PC)'; echo '```'; cat dry-run-pc.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run du pipeline (1re spécialité, second degré, sans clé ni appel API)
        shell: bash
        run: |
          npx tsx pipeline/run.ts math-1re-spe-second-degre --level 1re --subject mathematiques --parcours specialite --exercises 5 --batch 2>&1 | tee dry-run-1re.log
          grep -q "mode dry-run" dry-run-1re.log
          grep -q "contrôle des données : OK (1re, mathematiques" dry-run-1re.log
          if grep -qE "soumis|coût réel" dry-run-1re.log; then echo "::error::le dry-run a tenté un appel API"; exit 1; fi
          { echo '### Dry-run pipeline (1re)'; echo '```'; cat dry-run-1re.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
